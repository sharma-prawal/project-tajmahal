name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Content pipeline validation
        run: pnpm content:lint | tee content-lint.log

      - name: Report production bundle + content budget
        run: |
          echo "### Production bundle" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/* | sort -rh >> "$GITHUB_STEP_SUMMARY"
          echo "### Content budget" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Content budget report/,/^---$/p' content-lint.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
